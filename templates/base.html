<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Student Portal{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    {% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='settings.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='courses.css') }}">
{% endblock %}
</head>

<body>

<aside class="sidebar">

    <div class="sidebar-header">
        <h2>Student Portal</h2>
        <p>Student Dashboard</p>
    </div>

<nav class="sidebar-nav">

    <a href="{{ url_for('home') }}"
       class="nav-link {% if request.endpoint == 'home' %}active{% endif %}">
        <span class="nav-icon">⌂</span>
        <span>Dashboard</span>
    </a>

    <a href="{{ url_for('courses') }}"
       class="nav-link {% if request.endpoint == 'courses' %}active{% endif %}">
        <span class="nav-icon">▣</span>
        <span>Courses</span>
    </a>

    <a href="#"
       class="nav-link {% if request.endpoint == 'grades' %}active{% endif %}">
        <span class="nav-icon">▣</span>
        <span>Grades</span>
    </a>

    <a href="#"
       class="nav-link {% if request.endpoint == 'events' %}active{% endif %}">
        <span class="nav-icon">▣</span>
        <span>Events</span>
    </a>

    <a href="{{ url_for('attendance') }}"
       class="nav-link {% if request.endpoint == 'attendance' %}active{% endif %}">
        <span class="nav-icon">▣</span>
        <span>Attendance</span>
    </a>

    <a href="{{ url_for('settings') }}"
       class="nav-link {% if request.endpoint == 'settings' %}active{% endif %}">
        <span class="nav-icon">⚙</span>
        <span>Settings</span>
    </a>

</nav>

    <div class="sidebar-footer">
        <a href="{{ url_for('login') }}" class="logout-link">
            <span class="nav-icon">↪</span>
            <span>Logout</span>
        </a>
    </div>

</aside>

    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
